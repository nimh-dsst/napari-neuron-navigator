name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.platform }} (Python 3.11)
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          environments: ci

      - name: Verify Python version
        run: pixi run -e ci python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"

      - name: Verify napari version
        run: pixi run -e ci python -c "import napari; assert napari.__version__.startswith('0.9.'), napari.__version__"

      - name: Install package in development mode
        run: pixi run -e ci pip install -e . --no-deps

      - name: Run tests
        run: pixi run -e ci pytest -v --color=yes

  # Keep sidecar I/O diagnostics independent of GUI test collection/failures.
  region-profile-windows:
    name: Regional-profile sidecar (Windows, Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          environments: ci

      - name: Verify Python version
        run: pixi run -e ci python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"

      - name: Install package in development mode
        run: pixi run -e ci build

      - name: Create, rebuild, validate, and query regional-profile sidecars
        run: pixi run -e ci test-region-profile --color=yes --junitxml=test-results/region-profile.xml

      - name: Upload regional-profile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: region-profile-windows-results
          path: test-results/region-profile.xml
          if-no-files-found: warn

  # Separate job for Linux with xvfb for headless display
  test-linux:
    name: ubuntu-latest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          environments: ci

      - name: Verify Python version
        run: pixi run -e ci python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"

      - name: Verify napari version
        run: pixi run -e ci python -c "import napari; assert napari.__version__.startswith('0.9.'), napari.__version__"

      - name: Install package in development mode
        run: pixi run -e ci pip install -e . --no-deps

      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y openbox xvfb

      - name: Run tests with xvfb
        run: |
          openbox >/tmp/openbox.log 2>&1 &
          xvfb-run -a pixi run -e ci pytest -v --color=yes
