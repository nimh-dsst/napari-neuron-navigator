[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-neuron-navigator"
dynamic = ["version"]
description = "A napari plugin for navigating and analyzing neuronal morphologies"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "napari[pyqt6]>=0.9,<0.10",
    "numpy>=1.24",
    "matplotlib",
    "brainglobe-atlasapi>=2.0",
    "truststore>=0.10.5,<0.11",
    "pyarrow>=14.0",
    "duckdb>=0.9",
    "pandas>=2.0",
    "xlsxwriter>=3.2",
    "qtpy>=2.0",
    "pyqtgraph>=0.13",
    "pynrrd>=1.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "seaborn>=0.13",
]

[project.optional-dependencies]
testing = [
    "openpyxl>=3.1",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.entry-points."napari.manifest"]
napari-neuron-navigator = "napari_neuron_navigator:napari.yaml"

[tool.setuptools_scm]
write_to = "src/napari_neuron_navigator/_version.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated and scheduled for removal in a future version\\.:DeprecationWarning:nrrd\\.writer",
    "ignore:`json_encoders` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20",
]
